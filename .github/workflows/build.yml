name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gerekli SDK paketlerini indir
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle wrapper oluştur
        run: |
          mkdir -p /tmp/wrapper-gen
          cd /tmp/wrapper-gen
          gradle wrapper --gradle-version 8.4
          cp -r gradlew gradlew.bat gradle "$GITHUB_WORKSPACE"/

      - name: Çalıştırma izni ver
        run: chmod +x ./gradlew

      - name: Debug APK derle
        run: ./gradlew assembleDebug --stacktrace

      - name: APK'yı yükle (indirilebilir hale getir)
        uses: actions/upload-artifact@v4
        with:
          name: obd-panel-debug-apk
