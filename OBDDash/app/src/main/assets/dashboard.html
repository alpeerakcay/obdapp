<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motor Paneli</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
  :root{
    --bg:#0B0D0F; --panel:#15181B; --hairline:#262B2F;
    --text:#E8ECEE; --text-dim:#7C868C; --cyan:#35D6C4; --red:#FF4A3D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; padding:18px 14px 40px; }
  .topbar{ display:flex; flex-direction:column; gap:8px; background:var(--panel); border:1px solid var(--hairline); border-radius:10px; padding:12px 14px; margin-bottom:14px; }
  .device-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 4px; border-top:1px solid var(--hairline); font-size:13.5px; }
  .device-row:first-child{ border-top:none; }
  .device-row button{ background:var(--cyan); color:#05201C; border:none; padding:7px 14px; border-radius:6px; font-weight:600; font-size:12.5px; cursor:pointer; }
  .refresh-btn{ background:transparent; border:1px solid var(--hairline); color:var(--text-dim); padding:7px 12px; border-radius:6px; font-size:12px; cursor:pointer; align-self:flex-start; }
  .status{ display:flex; align-items:center; gap:7px; font-size:13px; color:var(--text-dim); }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--red); }
  .dot.live{ background:var(--cyan); box-shadow:0 0 8px var(--cyan); }
  .empty{ color:var(--text-dim); font-size:13px; padding:6px 2px; }

  .cluster{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  .gauge-card{ background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:14px 10px 10px; display:flex; flex-direction:column; align-items:center; }
  .gauge-label{ font-size:12px; color:var(--text-dim); margin-top:4px; }
  .gauge-value{ font-family:'Oswald',sans-serif; font-weight:600; line-height:1; font-size:42px; }
  .gauge-unit{ font-size:12px; color:var(--text-dim); margin-left:4px; }

  .minirow{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
  .mini-card{ background:var(--panel); border:1px solid var(--hairline); border-radius:10px; padding:10px 8px; text-align:center; }
  .mini-card .gauge-value{ font-size:20px; }
  .mini-card .gauge-label{ font-size:10.5px; margin-top:2px; }

  .dtc-panel{ background:var(--panel); border:1px solid var(--hairline); border-radius:12px; padding:14px; }
  .dtc-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .dtc-header h2{ font-family:'Oswald'; font-size:16px; font-weight:500; }
  .dtc-header button{ background:transparent; border:1px solid var(--hairline); color:var(--text-dim); padding:6px 12px; border-radius:6px; font-size:12px; cursor:pointer; }
  .dtc-empty{ color:var(--text-dim); font-size:13px; padding:10px 2px; }
  .dtc-row{ display:flex; justify-content:space-between; gap:10px; padding:9px 4px; border-top:1px solid var(--hairline); font-size:13.5px; }
  .dtc-code{ font-family:'Oswald'; color:var(--red); font-weight:500; min-width:60px; }
  .dtc-desc{ color:var(--text-dim); flex:1; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Bağlı değil</span></div>
    <button class="refresh-btn" id="refreshBtn">Eşleşmiş cihazları yenile</button>
    <div id="deviceList"><div class="empty">Cihaz listesi için yenile'ye bas.</div></div>
  </div>

  <div class="cluster">
    <div class="gauge-card">
      <svg id="gaugeRPM" width="180" height="110" viewBox="0 0 180 110"></svg>
      <div class="gauge-value"><span id="valRPM">--</span></div>
      <div class="gauge-label">DEVİR (rpm)</div>
    </div>
    <div class="gauge-card">
      <svg id="gaugeSpeed" width="180" height="110" viewBox="0 0 180 110"></svg>
      <div class="gauge-value"><span id="valSpeed">--</span><span class="gauge-unit">km/h</span></div>
      <div class="gauge-label">HIZ</div>
    </div>
  </div>

  <div class="minirow">
    <div class="mini-card"><div class="gauge-value" id="valCoolant">--°C</div><div class="gauge-label">MOTOR SICAKLIĞI</div></div>
    <div class="mini-card"><div class="gauge-value" id="valVoltage">--V</div><div class="gauge-label">AKÜ VOLTAJI</div></div>
    <div class="mini-card"><div class="gauge-value" id="valThrottle">--%</div><div class="gauge-label">GAZ KELEBEĞİ</div></div>
    <div class="mini-card"><div class="gauge-value" id="valLoad">--%</div><div class="gauge-label">MOTOR YÜKÜ</div></div>
    <div class="mini-card"><div class="gauge-value" id="valIntake">--°C</div><div class="gauge-label">EMİŞ HAVA SICAKLIĞI</div></div>
    <div class="mini-card"><div class="gauge-value" id="valFuel">--%</div><div class="gauge-label">YAKIT SEVİYESİ</div></div>
  </div>

  <div class="dtc-panel">
    <div class="dtc-header">
      <h2>Arıza Kodları</h2>
      <button id="clearBtn">Kodları Temizle</button>
    </div>
    <div id="dtcList"><div class="dtc-empty">Henüz veri yok.</div></div>
  </div>

<script>
const NS = "http://www.w3.org/2000/svg";

function buildArc(svgId, max, redline, color){
  const svg = document.getElementById(svgId);
  svg.innerHTML = "";
  const cx=90, cy=95, r=75, startA=200, endA=-20;
  function pt(a,radius){ const rad=a*Math.PI/180; return [cx-radius*Math.cos(rad), cy-radius*Math.sin(rad)]; }
  function arcPath(a1,a2,radius){
    const [x1,y1]=pt(a1,radius), [x2,y2]=pt(a2,radius);
    const large = Math.abs(a2-a1) > 180 ? 1:0;
    return `M ${x1} ${y1} A ${radius} ${radius} 0 ${large} 1 ${x2} ${y2}`;
  }
  const track = document.createElementNS(NS,"path");
  track.setAttribute("d", arcPath(startA,endA,r));
  track.setAttribute("fill","none"); track.setAttribute("stroke","#262B2F");
  track.setAttribute("stroke-width","10"); track.setAttribute("stroke-linecap","round");
  svg.appendChild(track);
  if(redline){
    const redStart = startA - (startA-endA)*(redline/max);
    const rz = document.createElementNS(NS,"path");
    rz.setAttribute("d", arcPath(redStart,endA,r));
    rz.setAttribute("fill","none"); rz.setAttribute("stroke","#3a1f1c");
    rz.setAttribute("stroke-width","10"); rz.setAttribute("stroke-linecap","round");
    svg.appendChild(rz);
  }
  const needle = document.createElementNS(NS,"path");
  needle.setAttribute("id", svgId+"_needle");
  needle.setAttribute("fill","none"); needle.setAttribute("stroke",color);
  needle.setAttribute("stroke-width","10"); needle.setAttribute("stroke-linecap","round");
  svg.appendChild(needle);
  return {id:svgId,startA,endA,arcPath,max,r,redline,color};
}
function setArc(state, value){
  const {startA,endA,arcPath,max,r,redline,color} = state;
  const frac = Math.max(0, Math.min(1, value/max));
  const a2 = startA - (startA-endA)*frac;
  const needle = document.getElementById(state.id+"_needle");
  const inRed = redline && value >= redline;
  needle.setAttribute("stroke", inRed ? "#FF4A3D" : color);
  needle.setAttribute("d", arcPath(startA, a2, r));
}
const rpmState = buildArc("gaugeRPM", 8000, 6000, "#35D6C4");
const speedState = buildArc("gaugeSpeed", 220, null, "#35D6C4");

function fmt(v, digits=0){ return (v===null||v===undefined||isNaN(v)) ? "--" : Number(v).toFixed(digits); }

// ---- Android tarafının çağıracağı global fonksiyonlar ----
window.onStatus = function(live, text){
  document.getElementById("statusDot").classList.toggle("live", live);
  document.getElementById("statusText").textContent = text;
};

window.onData = function(d){
  document.getElementById("valRPM").textContent = fmt(d.rpm);
  document.getElementById("valSpeed").textContent = fmt(d.speed);
  document.getElementById("valCoolant").textContent = fmt(d.coolant_temp) + "°C";
  document.getElementById("valVoltage").textContent = fmt(d.voltage,1) + "V";
  document.getElementById("valThrottle").textContent = fmt(d.throttle) + "%";
  document.getElementById("valLoad").textContent = fmt(d.engine_load) + "%";
  document.getElementById("valIntake").textContent = fmt(d.intake_temp) + "°C";
  document.getElementById("valFuel").textContent = fmt(d.fuel_level) + "%";
  setArc(rpmState, d.rpm || 0);
  setArc(speedState, d.speed || 0);

  if(d.dtcs !== undefined && d.dtcs !== null){
    const list = document.getElementById("dtcList");
    if(d.dtcs.length === 0){
      list.innerHTML = '<div class="dtc-empty">Aktif arıza kodu yok.</div>';
    } else {
      list.innerHTML = d.dtcs.map(c =>
        `<div class="dtc-row"><span class="dtc-code">${c.code}</span><span class="dtc-desc">${c.desc}</span></div>`
      ).join("");
    }
  }
};

// ---- Cihaz listesi ----
function refreshDevices(){
  const container = document.getElementById("deviceList");
  if(!window.Android){
    container.innerHTML = '<div class="empty">Native köprü bulunamadı (uygulama içinde açılmalı).</div>';
    return;
  }
  let devices = [];
  try{ devices = JSON.parse(Android.getPairedDevices()); } catch(e){ devices = []; }
  if(devices.length === 0){
    container.innerHTML = '<div class="empty">Eşleşmiş cihaz yok. Önce telefonun Bluetooth ayarlarından ELM327 ile eşleştir.</div>';
    return;
  }
  container.innerHTML = devices.map(dv =>
    `<div class="device-row"><span>${dv.name} (${dv.address})</span><button onclick="connectTo('${dv.address}')">Bağlan</button></div>`
  ).join("");
}

function connectTo(address){
  if(window.Android){ Android.connect(address); }
}

document.getElementById("refreshBtn").addEventListener("click", refreshDevices);
document.getElementById("clearBtn").addEventListener("click", () => {
  if(window.Android){ Android.clearDtc(); }
});

window.addEventListener("load", refreshDevices);
</script>
</body>
</html>
